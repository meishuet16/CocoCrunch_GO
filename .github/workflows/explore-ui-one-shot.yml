name: Explore UI one-shot patch

on:
  push:
    branches:
      - ui/explore-discovery-redesign

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: redesign Explore discovery experience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/explore-discovery-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Explore UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/AppRescued.tsx')
          app = app_path.read_text()

          app = app.replace(
              "Gavel, Heart, Link2, Map, MapPin, PackageCheck, ReceiptText,\n  Send, Sparkles, Users, X",
              "Gavel, Heart, Link2, Map, MapPin, PackageCheck, ReceiptText,\n  Search, Send, SlidersHorizontal, Sparkles, Users, X"
          )

          state_anchor = "  const [destinationSearched, setDestinationSearched] = useState(true);\n"
          if "const [exploreQuery" not in app:
              app = app.replace(state_anchor, state_anchor + "  const [exploreQuery, setExploreQuery] = useState('');\n  const [exploreFilter, setExploreFilter] = useState<'all' | 'food' | 'slow' | 'budget'>('all');\n  const [selectedPlaceId, setSelectedPlaceId] = useState<number | null>(null);\n")

          new_render = r'''  function renderExplore() {
    const query = exploreQuery.trim().toLowerCase();
    const filteredRecommendations = recommendations.filter(place => {
      const matchesQuery = !query || [place.name, place.type, place.why, place.cost, place.duration].join(' ').toLowerCase().includes(query);
      const matchesFilter = exploreFilter === 'all'
        || (exploreFilter === 'food' && /food|cafe|café|market|ramen|tea|matcha/i.test(`${place.name} ${place.type} ${place.why}`))
        || (exploreFilter === 'slow' && /slow|quiet|scenic|garden|walk|relax|calm/i.test(`${place.name} ${place.type} ${place.why}`))
        || (exploreFilter === 'budget' && !/premium|luxury/i.test(`${place.cost} ${place.type}`));
      return matchesQuery && matchesFilter;
    });

    return <div className="explore-screen explore-redesign">
      <header className="explore-discovery-head">
        <span>EXPLORE</span>
        <h2>Find somewhere worth the detour.</h2>
        <p>Browse ideas for {destination}, then save one for yourself or suggest it to the group.</p>
      </header>

      <label className="explore-searchbar">
        <Search size={18}/>
        <input value={exploreQuery} onChange={e => setExploreQuery(e.target.value)} placeholder="Search cafés, places, vibes…" aria-label="Search Explore recommendations"/>
        {exploreQuery && <button type="button" onClick={() => setExploreQuery('')} aria-label="Clear search"><X size={15}/></button>}
      </label>

      <div className="explore-filter-row" aria-label="Explore filters">
        <button className={exploreFilter === 'all' ? 'active' : ''} onClick={() => setExploreFilter('all')}>For you</button>
        <button className={exploreFilter === 'food' ? 'active' : ''} onClick={() => setExploreFilter('food')}>Food + café</button>
        <button className={exploreFilter === 'slow' ? 'active' : ''} onClick={() => setExploreFilter('slow')}>Slow days</button>
        <button className={exploreFilter === 'budget' ? 'active' : ''} onClick={() => setExploreFilter('budget')}>Budget-safe</button>
      </div>

      <section className="explore-editorial-hero">
        <div className="explore-editorial-art" aria-hidden="true"><span>COCO PICK</span><b>{destination}</b><small>same places, more your trip</small></div>
        <div className="explore-editorial-copy">
          <span>YOUR NEXT LITTLE YES</span>
          <h3>{tingoBehavior.recommendationBias === 'novelty' ? 'A small surprise, without wrecking the plan.' : 'Good places that fit the pace you already chose.'}</h3>
          <p>{tingoBehavior.itineraryDensity} pace · {tingoBehavior.budgetMode} budget · {mode === 'group' ? `${travellerCount} travellers` : 'solo trip'}</p>
        </div>
      </section>

      <div className="explore-section-heading explore-results-heading"><span>{query ? `RESULTS · ${filteredRecommendations.length}` : 'RECOMMENDED FOR YOU'}</span><span className="quiet-note">Tingo-ranked · active trip context</span></div>
      {filteredRecommendations.length > 0 ? <section className="explore-place-grid">
        {filteredRecommendations.map(place => <article className={`explore-place-card place-card-${(place.id % 4) + 1}`} key={place.id}>
          <button className="explore-place-visual" onClick={() => { setSelectedPlaceId(place.id); setDrawer('discover'); }} aria-label={`Open ${place.name} details`}>
            <span className="place-type">{place.type}</span>
            <span className="place-save-badge">{place.saved ? '♥' : '♡'}</span>
            <i aria-hidden="true"/>
          </button>
          <div className="explore-place-body">
            <div className="explore-place-title"><div><b>{place.name}</b><small>{place.type} · {place.duration}</small></div><span>{place.match}% fit</span></div>
            <p>{place.why}</p>
            <div className="explore-place-meta"><span>{place.cost}</span><span>{mode === 'group' ? 'Group-aware' : 'Solo fit'}</span></div>
            <div className="explore-place-actions">
              <button className={place.saved ? 'is-done' : ''} onClick={() => toggleRecommendation(place.id, 'save')}><Heart size={14}/>{place.saved ? 'Saved' : 'Save'}</button>
              <button className={place.added ? 'is-done' : ''} onClick={() => toggleRecommendation(place.id, 'add')}><Send size={14}/>{mode === 'group' ? (place.added ? 'Suggested' : 'Suggest') : (place.added ? 'In plan' : 'Add')}</button>
            </div>
          </div>
        </article>)}
      </section> : <section className="explore-empty paper-sheet"><Coco tiny context="travel"/><div><b>No exact match yet.</b><small>Try a place name, category or vibe. Coco is filtering the local prototype catalog, not pretending this is live search.</small></div></section>}

      {(ritualRecords.savedIdeas?.length ?? 0) > 0 && <><div className="explore-section-heading"><span>SAVED FOR LATER</span><span className="quiet-note">Private until you suggest it</span></div><section className="explore-saved-strip">{ritualRecords.savedIdeas?.slice(0, 4).map(idea => <span key={idea.name}><Heart size={12}/>{idea.name}</span>)}</section></>}

      <div className="explore-section-heading"><span>COMMUNITY NOTEBOOKS</span><button onClick={() => setDrawer('community')}>See all <ChevronRight size={14}/></button></div>
      <section className="explore-community explore-community--editorial">{communityTrips.map(trip => <article className="explore-community-card" key={trip.id}><div className={trip.id === 1 ? 'community-photo street-photo' : 'community-photo rain-photo'}><span>{trip.match}% fit</span></div><div><b>{trip.title}</b><small>By {trip.author} · explicitly shared</small><button onClick={() => setCommunityTrips(items => items.map(item => item.id === trip.id ? { ...item, saved: !item.saved } : item))}>{trip.saved ? 'Saved to ideas' : 'Save idea'}</button></div></article>)}</section>

      <div className="explore-governance-note"><SlidersHorizontal size={15}/><span><b>Explore finds possibilities.</b> Saved and suggested ideas do not silently change the official itinerary.</span></div>
    </div>;
  }

'''
          app, count = re.subn(r"  function renderExplore\(\) \{.*?\n  function renderGlobalMemories\(\) \{", new_render + "  function renderGlobalMemories() {", app, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace renderExplore')

          new_discover = r'''      {drawer === 'discover' && (() => {
        const place = recommendations.find(item => item.id === selectedPlaceId);
        if (!place) return <><span className="drawer-kicker">EXPLORE · {destination.toUpperCase()}</span><h3>Browse from the Explore page.</h3><p className="drawer-copy">Search, filters and recommendations now live together in Explore. Open any place card to see the full fit evidence here.</p><button className="primary" onClick={() => setDrawer(null)}>Back to Explore</button></>;
        return <div className="explore-place-detail">
          <div className={`explore-detail-visual place-card-${(place.id % 4) + 1}`}><span>{place.type}</span><b>{place.match}% fit</b><i aria-hidden="true"/></div>
          <span className="drawer-kicker">PLACE DETAIL · {destination.toUpperCase()}</span>
          <h3>{place.name}</h3>
          <p className="drawer-copy">{place.type} · {place.cost} · {place.duration}</p>
          <div className="explore-match-pill"><Heart size={14}/>{place.match}% match for {mode === 'group' ? 'your group' : 'your trip'}</div>
          <section className="explore-why-this"><span>WHY THIS FITS YOUR TRIP</span><p>{place.why}</p><ul><li>Fits your {tingoBehavior.itineraryDensity} trip pace</li><li>{tingoBehavior.budgetMode} budget context stays visible</li>{mode === 'group' && <li>Suggestion stays non-official until group confirmation</li>}</ul></section>
          <small className="explore-source-note">{place.source === 'prototype-catalog' ? 'Local prototype catalog · explainable recommendation evidence' : 'Fallback example · not live destination data'}</small>
          <div className="explore-detail-actions"><button className="secondary" onClick={() => toggleRecommendation(place.id, 'save')}><Heart size={15}/>{place.saved ? 'Saved' : 'Save'}</button><button className="primary" onClick={() => toggleRecommendation(place.id, 'add')}><Send size={15}/>{mode === 'group' ? (place.added ? 'Suggested to group' : 'Suggest to group') : (place.added ? 'In plan' : 'Add to plan')}</button></div>
        </div>;
      })()}
'''
          app, count = re.subn(r"      \{drawer === 'discover' && <>.*?</>\}\n(?=      \{drawer === 'tingo')", new_discover, app, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace discover drawer')

          app_path.write_text(app)

          main_path = Path('src/main.tsx')
          main = main_path.read_text()
          if "./explore-redesign.css" not in main:
              main = main.replace("import './gacha-interactions.css';", "import './gacha-interactions.css';\nimport './explore-redesign.css';")
          main_path.write_text(main)

          css = r'''
/* Explore discovery redesign — presentation only; existing discovery/governance logic stays in AppRescued. */
.explore-redesign { display:grid; gap:0; }
.explore-discovery-head { margin:2px 0 15px; }
.explore-discovery-head > span { color:var(--sangria); font-size:9px; font-weight:950; letter-spacing:.14em; }
.explore-discovery-head h2 { margin:5px 0 6px; font-family:Georgia,serif; font-size:31px; line-height:1.02; letter-spacing:-.035em; }
.explore-discovery-head p { margin:0; max-width:340px; color:var(--muted); font-size:11px; line-height:1.5; }
.explore-searchbar { min-height:46px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; padding:0 13px; border:1px solid rgba(147,5,0,.1); border-radius:18px; background:rgba(255,255,255,.72); box-shadow:0 8px 22px rgba(86,52,36,.045); color:#6c7882; }
.explore-searchbar input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:11px; }
.explore-searchbar input::placeholder { color:#9b8e87; }
.explore-searchbar button { border:0; padding:4px; background:transparent; color:var(--muted); }
.explore-filter-row { display:flex; gap:7px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
.explore-filter-row::-webkit-scrollbar { display:none; }
.explore-filter-row button { flex:0 0 auto; border:1px solid rgba(147,5,0,.1); border-radius:999px; padding:7px 11px; background:rgba(255,255,255,.45); color:var(--muted); font-size:9px; font-weight:800; }
.explore-filter-row button.active { border-color:var(--sangria); background:var(--sangria); color:#fff9ed; box-shadow:0 5px 12px rgba(147,5,0,.12); }
.explore-editorial-hero { margin-top:14px; overflow:hidden; border-radius:24px; background:#eef4f4; border:1px solid rgba(147,5,0,.08); }
.explore-editorial-art { min-height:162px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:17px; overflow:hidden; color:#fffdf5; background:linear-gradient(180deg,rgba(20,43,55,.02),rgba(20,43,55,.35)),linear-gradient(145deg,#cadfdf 0%,#8db7c5 48%,#406b79 100%); }
.explore-editorial-art::before { content:''; position:absolute; inset:34% -8% -18%; background:linear-gradient(155deg,rgba(255,248,231,.9),rgba(199,222,214,.72)); clip-path:polygon(0 39%,18% 20%,35% 34%,51% 6%,70% 31%,86% 12%,100% 25%,100% 100%,0 100%); opacity:.72; }
.explore-editorial-art::after { content:''; position:absolute; width:72px; height:118px; left:26px; bottom:-18px; border-radius:44px 44px 0 0; border:3px solid rgba(255,255,255,.55); transform:rotate(-8deg); opacity:.55; }
.explore-editorial-art span,.explore-editorial-art b,.explore-editorial-art small { position:relative; z-index:1; text-shadow:0 2px 9px rgba(20,35,43,.3); }
.explore-editorial-art span { font-size:8px; font-weight:950; letter-spacing:.12em; }
.explore-editorial-art b { margin-top:2px; font-family:Georgia,serif; font-size:30px; line-height:1; }
.explore-editorial-art small { margin-top:5px; font-size:9px; }
.explore-editorial-copy { padding:14px 15px 15px; background:rgba(255,255,255,.72); }
.explore-editorial-copy span { color:var(--sangria); font-size:8px; font-weight:950; letter-spacing:.11em; }
.explore-editorial-copy h3 { margin:5px 0; font-family:Georgia,serif; font-size:19px; line-height:1.08; }
.explore-editorial-copy p { margin:0; color:var(--muted); font-size:9px; }
.explore-results-heading { margin-top:19px; }
.explore-place-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
.explore-place-card { min-width:0; overflow:hidden; border:1px solid rgba(147,5,0,.09); border-radius:18px; background:rgba(255,255,255,.64); box-shadow:0 8px 18px rgba(68,49,38,.04); }
.explore-place-card:nth-child(3n+2) { margin-top:14px; }
.explore-place-visual { width:100%; height:128px; position:relative; overflow:hidden; display:block; border:0; padding:0; text-align:left; background:linear-gradient(145deg,#bed7d2,#6f9f9c); }
.explore-place-visual i,.explore-detail-visual i { position:absolute; inset:auto -14% -18% -12%; height:78%; background:rgba(255,248,231,.76); clip-path:polygon(0 47%,18% 21%,36% 46%,55% 8%,71% 39%,87% 17%,100% 31%,100% 100%,0 100%); }
.place-card-2 .explore-place-visual,.explore-detail-visual.place-card-2 { background:linear-gradient(145deg,#cdbca7,#986d4e 52%,#4d493e); }
.place-card-2 .explore-place-visual i,.explore-detail-visual.place-card-2 i { inset:31% 7% -8%; height:auto; border-radius:8px 8px 0 0; clip-path:none; background:linear-gradient(90deg,rgba(255,246,224,.88) 0 14%,rgba(91,67,47,.2) 14% 18%,rgba(255,246,224,.78) 18% 50%,rgba(91,67,47,.22) 50% 54%,rgba(255,246,224,.84) 54%); }
.place-card-3 .explore-place-visual,.explore-detail-visual.place-card-3 { background:linear-gradient(145deg,#b8c8e7,#7998c9 48%,#324e77); }
.place-card-4 .explore-place-visual,.explore-detail-visual.place-card-4 { background:linear-gradient(145deg,#d4d7b2,#8eaa76 48%,#4f745e); }
.place-type,.place-save-badge { position:absolute; z-index:2; top:8px; border-radius:999px; background:rgba(255,250,239,.92); color:#5a4a43; font-size:7px; font-weight:900; }
.place-type { left:8px; padding:4px 7px; }
.place-save-badge { right:8px; width:25px; height:25px; display:grid; place-items:center; color:var(--sangria); font-size:14px; }
.explore-place-body { display:grid; gap:7px; padding:10px; }
.explore-place-title { display:flex; align-items:start; justify-content:space-between; gap:7px; }
.explore-place-title > div { min-width:0; display:grid; gap:2px; }
.explore-place-title b { font-size:11px; line-height:1.15; }
.explore-place-title small { color:var(--muted); font-size:7.5px; line-height:1.25; }
.explore-place-title > span { flex:0 0 auto; border-radius:999px; padding:4px 6px; background:#daf2e8; color:#23664f; font-size:7px; font-weight:950; }
.explore-place-body p { margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--muted); font-size:8px; line-height:1.4; }
.explore-place-meta { display:flex; flex-wrap:wrap; gap:4px; }
.explore-place-meta span { padding:4px 6px; border-radius:999px; background:rgba(149,187,234,.16); color:#536f84; font-size:7px; font-weight:800; }
.explore-place-actions { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding-top:2px; }
.explore-place-actions button { min-height:31px; display:flex; align-items:center; justify-content:center; gap:4px; border:1px solid rgba(147,5,0,.12); border-radius:10px; background:transparent; color:var(--sangria); font-size:8px; font-weight:900; }
.explore-place-actions button:last-child { background:var(--sangria); color:#fff9ed; border-color:var(--sangria); }
.explore-place-actions button.is-done { background:rgba(149,187,234,.18); border-color:rgba(72,111,158,.18); color:#466f9e; }
.explore-empty { display:flex; align-items:center; gap:10px; padding:14px; border-radius:18px; }
.explore-empty div { display:grid; gap:3px; }.explore-empty b { font-size:11px; }.explore-empty small { color:var(--muted); font-size:8px; line-height:1.4; }
.explore-saved-strip { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.explore-saved-strip span { flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:7px 9px; border:1px solid rgba(147,5,0,.1); border-radius:999px; background:rgba(255,255,255,.48); color:var(--sangria); font-size:8px; font-weight:850; }
.explore-community--editorial .community-photo { height:96px; }
.explore-governance-note { margin-top:17px; display:flex; gap:8px; align-items:flex-start; padding:11px 1px; border-top:1px dashed rgba(147,5,0,.15); color:var(--muted); font-size:8px; line-height:1.45; }
.explore-governance-note svg { flex:0 0 auto; color:var(--sangria); }.explore-governance-note b { color:var(--ink); }
.explore-place-detail { display:grid; gap:12px; }
.explore-detail-visual { min-height:205px; position:relative; overflow:hidden; margin:-3px -3px 2px; border-radius:18px; background:linear-gradient(145deg,#bed7d2,#6f9f9c); }
.explore-detail-visual > span,.explore-detail-visual > b { position:absolute; z-index:2; top:12px; border-radius:999px; padding:5px 8px; background:rgba(255,250,239,.92); color:#5a4a43; font-size:8px; }
.explore-detail-visual > span { left:12px; }.explore-detail-visual > b { right:12px; color:#23664f; }
.explore-match-pill { width:max-content; max-width:100%; display:flex; align-items:center; gap:5px; padding:7px 9px; border-radius:999px; background:#daf2e8; color:#23664f; font-size:9px; font-weight:900; }
.explore-why-this { display:grid; gap:7px; padding:13px; border-radius:16px; background:rgba(149,187,234,.12); border:1px solid rgba(72,111,158,.08); }
.explore-why-this > span { color:var(--sangria); font-size:8px; font-weight:950; letter-spacing:.1em; }
.explore-why-this p { margin:0; font-family:Georgia,serif; font-size:15px; line-height:1.2; }
.explore-why-this ul { margin:0; padding-left:16px; color:var(--muted); font-size:9px; line-height:1.6; }
.explore-source-note { color:var(--muted); font-size:8px; line-height:1.4; }
.explore-detail-actions { display:grid; grid-template-columns:.8fr 1.2fr; gap:8px; }
.explore-detail-actions button { min-height:44px; display:flex; align-items:center; justify-content:center; gap:5px; }
@media (max-width:370px) { .explore-place-grid { gap:8px; }.explore-place-visual { height:112px; }.explore-place-actions { grid-template-columns:1fr; }.explore-discovery-head h2 { font-size:28px; } }
'''
          Path('src/explore-redesign.css').write_text(css.strip() + '\n')

          workflow = Path('.github/workflows/explore-ui-one-shot.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit redesigned Explore
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppRescued.tsx src/main.tsx src/explore-redesign.css .github/workflows/explore-ui-one-shot.yml
          git commit -m "feat: redesign Explore discovery experience"
          git push origin HEAD:ui/explore-discovery-redesign
